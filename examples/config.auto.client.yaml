# Client / agent gateway: no local LLM; route through peers.
# Connectivity: auto (mDNS → hole-punch/direct → relay).
#
#   peer-lm keygen --out ./data/client.key
#   # put the compute peer id into dial_peers + allowlist below
#   peer-lm serve -c examples/config.auto.client.yaml

gateway: "127.0.0.1:3012"
listen: "/ip4/0.0.0.0/tcp/0"
prefer_local: false
identity: "./data/client.key"

# MUST match the compute node's peer id from `peer-lm keygen` / logs.
allowlist:
  - "REPLACE_WITH_COMPUTE_PEER_ID"

connect:
  mode: auto
  mdns_timeout_secs: 5
  hole_punch_grace_secs: 15
  dcutr: true
  relays:
    - "/ip4/<RELAY_HOST>/tcp/4444/p2p/<RELAY_PEER_ID>"
  dial_peers:
    - "REPLACE_WITH_COMPUTE_PEER_ID"
  mesh_namespace: peer-lm
