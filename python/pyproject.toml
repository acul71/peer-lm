[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "peer-lm"
version = "0.1.0"
description = "OpenAI-compatible local gateway over py-libp2p (Python port of peer-lm)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  # PyPI libp2p==libp2p/py-libp2p; if you need unreleased features (relay v2/DCUtR/rendezvous),
  # switch to: libp2p @ git+https://github.com/libp2p/py-libp2p.git
  "libp2p>=0.8.1",
  "httpx>=0.27",
  "hypercorn>=0.17",
  "starlette>=0.40",
  "pyyaml>=6.0",
  "cbor2>=5.4",
  "typer>=0.12",
  "trio>=0.26",
  "multiaddr>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-trio>=0.8"]

[project.scripts]
peer-lm = "peer_lm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/peer_lm"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
trio_mode = true
testpaths = ["tests"]
pythonpath = ["src"]
